name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS (swift test)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios/BiometricCore
    steps:
      - uses: actions/checkout@v4
      - name: Versión de Swift
        run: swift --version
      - name: Build
        run: swift build
      - name: Tests
        run: swift test

  android:
    name: Android (unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # El repo no trae Gradle wrapper: usamos una versión fija compatible con AGP 8.5.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Tests
        run: gradle :biometric-core:test --no-daemon
      - name: Reportes de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android/biometric-core/build/reports/tests/
