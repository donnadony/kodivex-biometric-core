name: biometric_core_flutter
description: Puente Flutter al contrato BiometricCore (iOS + Android) de kodivex-biometric-core.
version: 0.2.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  pigeon: ^22.4.0

flutter:
  plugin:
    platforms:
      android:
        package: com.kodivex.biometric.flutter
        pluginClass: BiometricCoreFlutterPlugin
      ios:
        pluginClass: BiometricCoreFlutterPlugin
